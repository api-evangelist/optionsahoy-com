discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: optionsahoy.com
  note: >-
    Served from the apex host, which is also the OpenAPI servers[] host, the MCP host and the A2A JSON-RPC
    host — OptionsAhoy runs everything on one Cloudflare Pages origin. The legacy /.well-known/agent.json
    returns a byte-identical copy (5,042 bytes, same content), and a plain GET on the JSON-RPC endpoint
    https://optionsahoy.com/a2a returns the card as well. www.optionsahoy.com 301s every /.well-known/* path
    to the apex. A negative-control path (/.well-known/apievangelist-negative-control-7f3a9c.json) returns
    HTTP 404, so the 200 on agent-card.json is a served document, not a catch-all. Ownership is not in
    question: the card's provider.organization is "AlphaLatitude Inc." with provider.url
    https://optionsahoy.com, the OpenAPI at the same host names AlphaLatitude Inc. as info.contact, and the
    Terms of Use say the site is operated by AlphaLatitude Inc., a California corporation.
