  occurrences: 10
  source_operations: [optimizeAmtIso, calculateNso, calculateRsu, calculateConcentration, priceProtectivePut, checkQsbs, planEquityFunding, optimizeRsuLotOrder, stats, badge]
  causes: ['Calculator endpoints accept only POST (and OPTIONS for CORS preflight); stats and badge accept only GET.']
  remediation: Use POST with Content-Type application/json for calculators; GET for discovery, stats and badge.
