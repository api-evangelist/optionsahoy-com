problem_types:
- status: 400
  title: Invalid input or calculation failure
  component: '#/components/responses/BadRequest'
  occurrences: 8
  source_operations: [optimizeAmtIso, calculateNso, calculateRsu, calculateConcentration, priceProtectivePut, checkQsbs, planEquityFunding, optimizeRsuLotOrder]
  causes:
  - A required field is missing or malformed (the error names the field and the expected shape).
  - A growth/return/sale-price or volatility field was neither supplied, resolved by a covered ticker, nor set to the "market" sentinel ("required-field error naming the field").
  - An enum value outside the declared set (filingStatus is exactly single | married_joint | head_household; QSBS enums accept "unsure" where the schema says so).
  - A calculation failure for the given inputs.
  remediation: Fix the named field and resend; the call is stateless and idempotent so a retry has no side effect. Do not invent a value for the named field — ask the user.
