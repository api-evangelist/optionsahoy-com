summary: >-
  No rate limits are published for the REST API, the MCP server or the A2A endpoint. The contract declares no
  429 response, no RateLimit/X-RateLimit headers and no Retry-After; the for-agents page, llms.txt,
  llms-full.txt, AGENTS.md and the repository README say nothing about request quotas. The only statement
  that limiting exists at all is in the privacy policy — the server stores a hash of the caller's IP so it
  can "rate limit abusive traffic without keeping the address itself", and scenario-email sends are limited
  per address — with no number, window or signal attached. Live responses (GET /api/v1 200, POST /api/v1/qsbs
  400, MCP initialize 200) carried no rate-limit headers. An honest zero: an agent has no way to know a limit
  before it hits one, and no documented signal when it does.
