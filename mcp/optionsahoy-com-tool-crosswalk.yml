source: >-
  mcp/optionsahoy-com-mcp-tools.json (live tools/list, 2026-09-19) and a2a/optionsahoy-com-agent-card.json
  (live card) bound to openapi/optionsahoy-com-openapi.json (OpenAPI 3.1.0, 11 operations, fetched from
  https://optionsahoy.com/openapi.json). The provider states the binding itself: llms-full.txt prefixes every
  tool with "REST equivalent: POST https://optionsahoy.com/api/v1/<path>", and the for-agents page says
  "Every endpoint under /api/v1/* is wired to the same engine an MCP tool call lands on, so the response your
  agent would receive is byte-identical".
purpose: >-
  Make the MCP tool the first-class discovery unit and bind it to its backing REST operation. OptionsAhoy is
  the rare case where the three agent surfaces are the SAME eight calculators with the same names and the same
  input schemas; the divergence is in what surrounds them (MCP adds resources, prompts and a widget; REST adds
  discovery, stats and a badge; A2A adds nothing beyond the eight skills).
