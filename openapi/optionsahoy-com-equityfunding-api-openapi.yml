    IsoDate:
      type: string
      format: date
      description: ISO 8601 date string (YYYY-MM-DD).
    FilingStatus:
      type: string
      enum:
      - single
      - married_joint
      - head_household
      description: United States federal filing status.
    EquityFundingInput:
      type: object
      description: Either `stacks` (v1.7+ multi-stack) OR legacy top-level `lots` + `currentPrice` (single-stack) must be provided.
      required:
      - targetAfterTax
      - targetDate
      - ordinaryIncome
      - filingStatus
      - stateCode
      anyOf:
      - required:
        - stacks
      - required:
        - lots
        - currentPrice
      properties:
        targetAfterTax:
          type: number
          minimum: 0
        targetDate:
          $ref: '#/components/schemas/IsoDate'
        stacks:
          type: array
          minItems: 1
          description: v1.7+ multi-stack input. Each stack is one ticker.
          items:
            type: object
            required:
            - currentPrice
            - lots
            properties:
              ticker:
                type: string
                description: Optional ticker label. When set without `expectedAnnualGrowth`, the server resolves growth from the trailing-CAGR table.
              currentPrice:
                type: number
                minimum: 0
              expectedAnnualGrowth:
                type:
                - number
                - string
                description: Per-stack growth decimal (0.08 = 8%/yr), or the string "market" for the S&P 500 trailing average. Required unless `ticker` resolves it; omitting it is an error, not a flat default. Pass 0 for a deliberately flat-price plan.
              volatility:
                type: number
                minimum: 0
                description: Per-stack annualized σ. Overrides `defaultVolatility` for this stack.
                maximum: 5
              lots:
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                  - shares
                  - costBasisPerShare
                  - acquisitionDate
                  properties:
                    shares:
                      type: integer
                      minimum: 1
                    costBasisPerShare:
                      type: number
                      minimum: 0
                    acquisitionDate:
                      $ref: '#/components/schemas/IsoDate'
                    vestDate:
                      $ref: '#/components/schemas/IsoDate'
                      description: Optional. Future vest date for unvested RSU tranches; excluded from sales whose date precedes this.
        lots:
          type: array
          minItems: 1
          description: Legacy single-stack input (v1.5 / v1.6). Pair with top-level currentPrice.
          items:
            type: object
            required:
            - shares
            - costBasisPerShare
            - acquisitionDate
            properties:
              shares:
                type: integer
                minimum: 1
              costBasisPerShare:
                type: number
                minimum: 0
              acquisitionDate:
                $ref: '#/components/schemas/IsoDate'
        currentPrice:
          type: number
          minimum: 0
          description: Legacy single-stack current share price.
        expectedAnnualGrowth:
          type:
          - number
          - string
          description: 'Legacy single-stack annual growth decimal, or the string "market" for the S&P 500 trailing average. Required with legacy `lots`: pass 0 for a deliberately flat-price plan (omitting it is an error, not a flat default).'
        ordinaryIncome:
          type: number
          minimum: 0
        filingStatus:
          $ref: '#/components/schemas/FilingStatus'
        stateCode:
          $ref: '#/components/schemas/StateCode'
        cashInterestRate:
          type: number
          description: Annualized pre-tax yield on cash held between each sale and the target date. The server compounds at the after-tax marginal rate. Defaults to 0.
        riskToleranceShortfall:
          type: number
          minimum: 0
          maximum: 1
          description: Max acceptable P(realized cash < target) under the lognormal price model. The `recommended` plan is the wealth-maximal plan whose shortfall is at or below this value. Default 0.10.
        defaultVolatility:
          type: number
          minimum: 0
          description: Annualized σ used for stacks that omit their own `volatility`. Default 0.30.
          maximum: 5
    StateCode:
      type: string
      pattern: ^[A-Z]{2}$
      description: Two-letter United States state code (e.g. CA, NY, TX).
