openapi: 3.2.0
info:
  title: OptionsAhoy Calculator Equity Funding API
  summary: Deterministic equity-compensation calculator endpoints. JSON in, JSON out.
  description: Multi-year equity-compensation optimization engine.
  version: 1.10.1
  contact:
    name: AlphaLatitude Inc.
    email: andrew@alphalatitude.com
    url: https://optionsahoy.com/for-agents
  license:
    name: Proprietary. Free for non-commercial use during beta.
    url: https://optionsahoy.com/terms
servers:
- url: https://optionsahoy.com
  description: Production
tags:
- name: EquityFunding
  description: Goal-funded equity-to-cash liquidation planning
paths:
  /api/v1/equity-funding:
    post:
      summary: 'Multi-plan equity-funding comparison: Lock-in-now / Balanced / Hold-for-growth…'
      description: Returns four named plans on the risk/wealth frontier plus the full hybrid frontier. It searches for the optimum through a bracket-aware sweep over sale years, months, and lots, and the schedule is measured from the current date; lognormal price exposure drives the shortfall probability; after-tax retained-share value acts as a backstop in the shortfall calculation. The `recommended` plan is the wealth-maximal plan whose shortfall is at or below `riskToleranceShortfall` (default 0.10). Wealth-at-target is compared apples-to-apples on after-tax basis (cash netted plus after-tax retained-share value, both compounded at the after-tax cash-interest rate).
      operationId: planEquityFunding
      tags:
      - EquityFunding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquityFundingInput'
            example:
              targetAfterTax: 200000
              targetDate: '2028-01-01'
              ordinaryIncome: 200000
              filingStatus: single
              stateCode: CA
              cashInterestRate: 0.04
              stacks:
              - currentPrice: 100
                expectedAnnualGrowth: 0.08
                volatility: 0.4
                lots:
                - shares: 2000
                  costBasisPerShare: 20
                  acquisitionDate: '2022-01-01'
      responses:
        '200':
          $ref: '#/components/responses/EquityFundingSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
components:
  responses:
    MethodNotAllowed:
      description: Endpoint accepts only POST (and OPTIONS for CORS preflight).
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                type: string
    BadRequest:
      description: Invalid input or calculation failure. The `error` string names the specific field or condition.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                type: string
    EquityFundingSuccess:
      description: Successful equity_funding_plan result.
      content:
        application/json:
          schema:
            type: object
            required:
            - ok
            - result
            properties:
