openapi: 3.2.0
info:
  title: OptionsAhoy Calculator ISO API
  summary: Deterministic equity-compensation calculator endpoints. JSON in, JSON out.
  description: Multi-year equity-compensation optimization engine.
  version: 1.10.1
  contact:
    name: AlphaLatitude Inc.
    email: andrew@alphalatitude.com
    url: https://optionsahoy.com/for-agents
  license:
    name: Proprietary. Free for non-commercial use during beta.
    url: https://optionsahoy.com/terms
servers:
- url: https://optionsahoy.com
  description: Production
tags:
- name: ISO
  description: Incentive stock options
paths:
  /api/v1/amt-iso:
    post:
      summary: Multi-year ISO exercise schedule optimization
      description: Returns a multi-year Incentive Stock Option (ISO) exercise schedule that maximizes after-tax Net Final Value (NFV) while minimizing federal and state Alternative Minimum Tax (AMT) across the horizon, accounting for AMT credit recovery in later years, qualifying-disposition timing, grant expiration, and the post-termination exercise window. The optimizer searches its full discretized candidate space and refines the result share by share, matching a brute-force maximum to the cent on the published tractable case. Its post-termination partial-exercise figure is scanned, so it can land a few shares off the exact optimum. Timing fields are measured from the current date.
      operationId: optimizeAmtIso
      tags:
      - ISO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmtIsoInput'
            example:
              shares: 10000
              strike: 2
              fmv: 200
              expectedGrowth: 0.15
              volatility: 0.5
              filingStatus: married_joint
              ordinaryIncome: 400000
              stateCode: CA
              carryforwardCredit: 0
              horizon: 4
              cashReturnRate: 0.05
              grantDate: '2022-01-15'
              hasLeftCompany: false
              terminationDate: null
      responses:
        '200':
          $ref: '#/components/responses/AmtIsoSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
components:
  responses:
    MethodNotAllowed:
      description: Endpoint accepts only POST (and OPTIONS for CORS preflight).
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                type: string
    BadRequest:
      description: Invalid input or calculation failure. The `error` string names the specific field or condition.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
