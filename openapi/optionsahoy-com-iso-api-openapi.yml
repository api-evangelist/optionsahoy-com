  schemas:
    AmtIsoInput:
      type: object
      required:
      - shares
      - strike
      - fmv
      - filingStatus
      - ordinaryIncome
      - stateCode
      - horizon
      - grantDate
      - hasLeftCompany
      properties:
        shares:
          type: integer
          minimum: 1
          description: Total ISO shares to exercise across the horizon.
        strike:
          type: number
          minimum: 0
          description: Strike price per share, USD.
        fmv:
          type: number
          minimum: 0
          description: Fair market value per share today (year 1).
        expectedGrowth:
          type:
          - number
          - string
          description: Arithmetic-mean annual growth rate, e.g. 0.10 for 10%/year. Required unless `ticker` resolves it from trailing CAGR. Also accepts the string "market" to use the S&P 500 trailing average when the user has no view.
        ticker:
          $ref: '#/components/schemas/Ticker'
        volatilityDrag:
          type: number
          minimum: 0
          maximum: 0.99
          description: Multiplicative haircut at the planning horizon. Either this OR `volatility` is required; if both are supplied, `volatilityDrag` wins.
        volatility:
          type: number
          minimum: 0
          description: Annualized volatility (sigma) of the stock. Either this OR `volatilityDrag` is required; if both are supplied, `volatilityDrag` wins. Derived drag = 1 - exp(-(sigma^2 / 2) * horizon).
          maximum: 5
        filingStatus:
          $ref: '#/components/schemas/FilingStatus'
        ordinaryIncome:
          type: number
          minimum: 0
          description: 'Annual ordinary income excluding the exercise. Taxable income after deductions, not gross wages: no standard or itemized deduction is applied.'
        stateCode:
          $ref: '#/components/schemas/StateCode'
        carryforwardCredit:
          type: number
          minimum: 0
          description: Existing federal AMT credit from prior years. Optional; defaults to 0 (most first-time exercisers have none).
        horizon:
          type: integer
          minimum: 1
          maximum: 10
          description: Planning horizon in years.
        cashReturnRate:
          type: number
          description: Annual after-tax return on idle cash, used to time-value AMT premiums. Optional; defaults to 0.04 when omitted.
        grantDate:
          $ref: '#/components/schemas/IsoDate'
          description: ISO grant date. Drives the 10-year expiration and 2-year qualifying-disposition gate.
        hasLeftCompany:
          type: boolean
        terminationDate:
          oneOf:
          - $ref: '#/components/schemas/IsoDate'
          - type: 'null'
          description: Termination date if departed; null otherwise. When set, opens the 90-day post-termination exercise window.
    Ticker:
      type: string
      description: Optional public-stock symbol (e.g. "NVDA"). When set, the API substitutes the ticker's trailing CAGR for any unsupplied expected-return / sale-price field instead of requiring the caller to invent one. ~90 symbols covered; unknown tickers fall through to 'required field' 400 errors.
    IsoDate:
      type: string
      format: date
      description: ISO 8601 date string (YYYY-MM-DD).
    FilingStatus:
      type: string
      enum:
      - single
      - married_joint
      - head_household
      description: United States federal filing status.
    StateCode:
      type: string
      pattern: ^[A-Z]{2}$
      description: Two-letter United States state code (e.g. CA, NY, TX).
    AmtIsoResult:
      type: object
      description: ISO/AMT exercise optimization result. All dollar amounts are USD.
      properties:
        crossoverShares:
          type: integer
          description: Maximum whole shares exercisable in year 1 before federal AMT exceeds regular tax (the AMT crossover).
        crossoverBargain:
          type: number
          description: 'Bargain element in dollars at the crossover share count: crossoverShares x (fmv - strike).'
        alreadyInAmt:
          type: boolean
          description: True when the user owes AMT even with zero exercise (regular tax below tentative minimum tax at baseline income).
        schedules:
          type: object
          description: The three candidate exercise schedules, each evaluated at the effective horizon. Their nfv values are directly comparable; optimized is the highest-NFV schedule the optimizer found.
          properties:
            lumpSum:
              type: object
              description: Exercise all shares in year 1.
              properties:
                label:
                  type: string
                  enum:
                  - lump_sum
                  - even_split
                  - optimized
                  description: Which candidate plan this schedule represents.
                years:
                  type: array
                  items:
                    type: object
                    description: Exercise and tax detail for one calendar year of the schedule.
                    properties:
                      year:
                        type: integer
                        description: Schedule year, 1-indexed (1 = current year).
                      shares:
                        type: number
                        description: ISO shares exercised this year.
                      bargain:
                        type: number
                        description: 'Bargain element recognized this year in dollars: shares x (projected FMV - strike).'
                      regularFederal:
                        type: number
                        description: Regular federal income tax for the year in dollars (ordinary income only, before AMT).
                      regularState:
                        type: number
                        description: Regular state income tax for the year in dollars.
                      tmtFederal:
                        type: number
                        description: Federal tentative minimum tax for the year in dollars.
                      tmtState:
                        type: number
                        description: State tentative minimum tax for the year in dollars (0 in states without AMT).
                      amtOwedFederal:
                        type: number
                        description: Federal AMT owed above regular tax this year in dollars.
                      amtOwedState:
                        type: number
                        description: State AMT owed above regular state tax this year in dollars.
                      creditRecovered:
                        type: number
                        description: Federal AMT credit applied (recovered) this year in dollars.
                      cashTax:
                        type: number
                        description: 'Total cash tax paid this year in dollars: federal + state, net of credit recovery.'
                    required:
                    - year
                    - shares
                    - bargain
                    - regularFederal
                    - regularState
                    - tmtFederal
                    - tmtState
                    - amtOwedFederal
                    - amtOwedState
                    - creditRecovered
                    - cashTax
                  description: Per-year detail, one entry per year of the effective horizon.
                totalTax:
                  type: number
                  description: Total cash tax paid across the horizon in dollars.
                baselineRegularTax:
                  type: number
                  description: Tax owed with no exercise at all (regular federal + state on ordinary income, summed across the horizon) in dollars.
                exerciseTax:
                  type: number
                  description: 'totalTax minus baselineRegularTax: the marginal tax cost of exercising, in dollars.'
                creditEarned:
                  type: number
                  description: Federal AMT credit generated across the horizon in dollars.
                creditRecovered:
                  type: number
                  description: Federal AMT credit recovered across the horizon in dollars.
                creditRemaining:
                  type: number
                  description: Federal AMT credit still unrecovered at the horizon in dollars.
                grossGain:
                  type: number
                  description: 'shares x (projected FMV at horizon - strike): the LTCG-eligible gain in dollars.'
                federalLTCG:
                  type: number
                  description: Federal long-term capital gains tax (including NIIT) on grossGain in dollars.
                stateLTCG:
                  type: number
                  description: State long-term capital gains tax on grossGain in dollars.
                amtPremiumFV:
                  type: number
                  description: Future-valued AMT premium stream (exercise tax paid above the no-exercise baseline, compounded at cashReturnRate to the horizon) in dollars.
                nfv:
                  type: number
                  description: 'After-tax Net Final Value at the horizon in dollars: grossGain - federalLTCG - stateLTCG - amtPremiumFV. This is the summary figure each schedule is scored on.'
              required:
              - label
              - years
              - totalTax
              - baselineRegularTax
              - exerciseTax
              - creditEarned
              - creditRecovered
              - creditRemaining
              - grossGain
              - federalLTCG
              - stateLTCG
              - amtPremiumFV
              - nfv
            evenSplit:
