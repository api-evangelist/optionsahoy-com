summary: >-
  OptionsAhoy's conformance profile is the open agent-protocol stack rather than any enterprise or financial
  interchange standard: OpenAPI 3.1.0, an MCP server at protocol version 2024-11-05 with tool annotations
  and outputSchema, an A2A 0.3.0 agent card, JSON-RPC 2.0 on both, llms.txt, RFC 9116 security.txt on two
  hosts, an MCP Registry server.json, SLSA build provenance on npm, and a robots.txt Content-Signal. It
  declares no OAuth/OIDC (keyless by design), no RFC 9457 problem details, no RFC 9727 API catalog, no
  APIs.json and no RFC 8594 sunset signalling. Its market — equity-compensation tax calculation — has no
  interchange standard to conform to; the domain claims it does make are about correctness against IRS
  published constants and independent tax engines, which are verification claims, not protocol conformance,
  and are recorded below as such.
standards:
- id: openapi-3.1
  conforms: true
  version: 3.1.0
  evidence: 'openapi/optionsahoy-com-openapi.json openapi "3.1.0"; parses; 11 paths, 11 operations, 21 component schemas, 3 component responses; every operation has operationId, summary, description and tags; 8 request-body examples; servers[] https://optionsahoy.com; info.contact, info.license and externalDocs present; no securitySchemes (keyless).'
  gaps:
  - Operation optimizeRsuLotOrder is tagged RsuLotOptimize, which tags[] does not declare.
  - The generic CalculatorSuccess response says "sample a call to discover the full structure", although per-calculator result schemas are in fact declared.
  - info.version 1.10.1 lags the live server (1.10.2).
- id: json-schema-2020-12
  conforms: true
  evidence: OpenAPI 3.1 schema objects (const, pattern, format date, enum) in components.schemas; MCP tools carry inputSchema with required[] and outputSchema per tool (mcp/optionsahoy-com-mcp-tools.json).
- id: mcp
  name: Model Context Protocol
  version: '2024-11-05'
  conforms: true
  evidence: 'POST https://optionsahoy.com/mcp initialize returned protocolVersion "2024-11-05", serverInfo {OptionsAhoy, 1.10.2}, capabilities tools/resources/prompts, an mcp-session-id header; tools/list returned 8 tools with inputSchema, outputSchema and annotations (readOnlyHint, idempotentHint, destructiveHint, openWorldHint); resources/list 9; prompts/list 8. See mcp/optionsahoy-com-mcp.yml.'
  note: The server negotiates 2024-11-05 even when a client offers 2025-03-26; Streamable HTTP transport with the newer session header is in use, so the declared version is conservative.
