- aid: optionsahoy-com:optionsahoy-a2a-agent
  name: OptionsAhoy Equity Planner (A2A Agent)
  description: >-
    Agent2Agent (A2A) protocol surface: an agent card served from https://optionsahoy.com/.well-known/agent-card.json
    (protocolVersion 0.3.0, JSONRPC transport, version 1.10.2, provider AlphaLatitude Inc.) advertising
    eight skills whose ids are the eight MCP tool names, each run by sending a message with a DataPart
    {"skill":"<id>","input":{...}} to the JSON-RPC endpoint at https://optionsahoy.com/a2a (message/send).
    The endpoint answers JSON-RPC 2.0 (tasks/get returns -32001 with a note that every call completes
    synchronously); streaming, push notifications and state-transition history are declared unsupported.
    Keyless.
  humanURL: https://optionsahoy.com/for-agents
