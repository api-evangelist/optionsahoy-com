apis:
- aid: optionsahoy-com:optionsahoy-mcp-server
  name: OptionsAhoy MCP Server
  description: >-
    Remote Model Context Protocol server at https://optionsahoy.com/mcp (Streamable HTTP, protocol version
    2024-11-05, serverInfo OptionsAhoy 1.10.2, no authentication). initialize, tools/list, resources/list
    and prompts/list answer anonymously: eight tools with inputSchema, outputSchema and annotations (readOnlyHint,
    idempotentHint true on all eight), nine resources including an Apps-SDK widget, and eight prompts.
    The same server ships as the npm stdio package optionsahoy-mcp (npx -y optionsahoy-mcp), a Claude
    Desktop .mcpb bundle and a Gemini CLI extension, and is listed in the Official MCP Registry, Smithery,
    Glama and the GitHub MCP Registry. Open source (MIT) at https://github.com/AlvisoOculus/optionsahoy-mcp.
  humanURL: https://optionsahoy.com/for-agents
  baseURL: https://optionsahoy.com/mcp
