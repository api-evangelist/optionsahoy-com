aid: optionsahoy-com
name: OptionsAhoy
description: >-
  AlphaLatitude Inc. is a Sunnyvale, California C-corporation (founded March 2026) that builds OptionsAhoy, an
  equity-compensation optimization product for individual investors: multi-year, multi-state tax planning for
  incentive stock options and the alternative minimum tax, non-qualified stock options, restricted stock
  units, qualified small business stock, single-stock concentration, protective-put and collar hedging, and
  selling equity to fund a cash goal. The paid platform is an invite-only beta; the eight calculators behind
  it are published free and keyless as in-browser tools and as three agent surfaces on one host — an
  11-operation OpenAPI 3.1.0 REST API at https://optionsahoy.com/api/v1, a remote MCP server at
  https://optionsahoy.com/mcp (eight annotated tools, also shipped as the optionsahoy-mcp npm stdio package
  and a Claude Desktop bundle), and an A2A 0.3.0 agent card at /.well-known/agent-card.json with eight
  skills. The engine is deterministic (no model inference) and the provider publishes a verification page
  reproducing its federal and state tax math against IRS Rev. Proc. 2025-32, PSL Tax-Calculator and
  OpenTaxSolver.
