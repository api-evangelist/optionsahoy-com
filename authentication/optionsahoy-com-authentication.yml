  headline: >-
    No authentication on any surface, by design and by statement. The OpenAPI 3.1.0 contract declares no
    securitySchemes and no security requirement; the for-agents page says "No API key, no OAuth"; llms.txt
    says "no auth, no install"; the agent card says "OptionsAhoy's API is keyless"; SECURITY.md says "No
    accounts, no authentication, no stored user data." The MCP server answers initialize and tools/list
    anonymously and serves no OAuth/OIDC discovery documents (/.well-known/oauth-authorization-server,
    /.well-known/oauth-protected-resource and /.well-known/openid-configuration all 404). This is a genuine
    zero-credential public API, not an undocumented gate: derive-authentication.py correctly produced no
    profile, and this file records the absence from the provider's own statements so the auth model reads as
    "open" rather than "unknown".
