summary: >-
  OptionsAhoy has no separate sandbox, test mode or test keys, and does not need one: the production API is
  free, keyless and side-effect free, so production IS the sandbox. What the provider publishes instead is a
  live interactive playground on the developer page ("Try it on the live API — pick a tool, edit the JSON on
  the left, and click Run"), a browsable reference whose request/response examples are generated from the
  live spec and re-run against the engine, eight verbatim example request bodies inside the OpenAPI, the
  in-browser calculators that run the same engine client-side, and third-party demos (a Hugging Face Space
  and a Poe bot) wired to the same endpoints.
test_vs_live:
  separate_environment: false
  key_prefixes: not applicable — no keys
  note: One host, one engine. "Every endpoint under /api/v1/* is wired to the same engine an MCP tool call lands on, so the response your agent would receive is byte-identical to what you see here."
playground:
  url: https://optionsahoy.com/for-agents#try-it
  kind: interactive request editor posting to the production /api/v1/* endpoints
  presets: ['Realistic (ticker) — ticker-based inputs that resolve growth and volatility from market data', 'Canonical (ticker-less)']
  privacy_note: 'The privacy policy discloses that "The interactive API playground on our For Agents page posts whatever text you put in its input box to our public API."'
reference_with_live_examples:
  url: https://optionsahoy.com/for-agents/api
  note: 'Per the page: "The request and response examples are generated from the live OpenAPI 3.1 spec (v 1.10.1) - each response is the actual output the engine returns for the request shown, so nothing here can drift from the API."'
